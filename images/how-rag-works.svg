<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- canvas: light so it stays readable in both GitHub themes -->
  <rect x="0" y="0" width="920" height="580" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">How a RAG chatbot works</text>
  <text x="460" y="62" text-anchor="middle" font-size="13" fill="#6B7280">Prepare your documents once, then answer questions from them forever</text>

  <!-- ============ PREPARE LANE ============ -->
  <rect x="30" y="90" width="860" height="170" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <rect x="30" y="78" width="230" height="30" rx="15" fill="#6366F1"/>
  <text x="145" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">PREPARE · RUN ONCE</text>

  <!-- Your documents -->
  <rect x="60" y="150" width="160" height="60" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="140" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Your documents</text>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#6366F1">.txt / .pdf</text>

  <!-- Split into chunks -->
  <rect x="300" y="150" width="160" height="60" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="380" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Split into</text>
  <text x="380" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">small chunks</text>

  <!-- Vector store -->
  <rect x="560" y="124" width="290" height="48" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="705" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Vector store</text>
  <text x="705" y="161" text-anchor="middle" font-size="11" fill="#6366F1">semantic search · by meaning</text>

  <!-- Keyword index -->
  <rect x="560" y="186" width="290" height="48" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="705" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Keyword index</text>
  <text x="705" y="223" text-anchor="middle" font-size="11" fill="#6366F1">exact words · BM25</text>

  <!-- prepare arrows -->
  <line x1="220" y1="180" x2="296" y2="180" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <line x1="460" y1="172" x2="556" y2="148" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <line x1="460" y1="188" x2="556" y2="210" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- ============ CHAT LANE ============ -->
  <rect x="30" y="330" width="860" height="210" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <rect x="30" y="318" width="250" height="30" rx="15" fill="#10B981"/>
  <text x="155" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">CHAT · EVERY QUESTION</text>

  <!-- User question -->
  <rect x="55" y="430" width="150" height="62" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="130" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#064E3B">User question</text>

  <!-- Find relevant chunks -->
  <rect x="275" y="428" width="190" height="66" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="370" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#064E3B">Find relevant</text>
  <text x="370" y="474" text-anchor="middle" font-size="14" font-weight="600" fill="#064E3B">chunks</text>

  <!-- LLM: receives the question + the retrieved chunks, then writes the answer -->
  <rect x="535" y="427" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="615" y="450" text-anchor="middle" font-size="14" font-weight="600" fill="#064E3B">LLM writes</text>
  <text x="615" y="467" text-anchor="middle" font-size="14" font-weight="600" fill="#064E3B">the answer</text>
  <text x="615" y="486" text-anchor="middle" font-size="10.5" fill="#059669">from question + chunks</text>

  <!-- Answer + sources -->
  <rect x="740" y="430" width="140" height="62" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="810" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#064E3B">Answer</text>
  <text x="810" y="475" text-anchor="middle" font-size="14" font-weight="600" fill="#064E3B">+ sources</text>

  <!-- chat arrows -->
  <line x1="205" y1="461" x2="271" y2="461" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="465" y1="461" x2="531" y2="461" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="695" y1="461" x2="736" y2="461" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- the user's question is ALSO sent to the LLM (not just the chunks) -->
  <path d="M130 494 C 220 540, 535 540, 612 500" fill="none" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="372" y="524" text-anchor="middle" font-size="11" font-style="italic" fill="#047857">the question is sent to the LLM too</text>

  <!-- ============ BRIDGE: indexes built once, reused every question ============ -->
  <line x1="620" y1="234" x2="410" y2="424" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="590" y1="234" x2="380" y2="424" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <rect x="430" y="286" width="300" height="24" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="580" y="302" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">the two indexes are reused for every question</text>
</svg>
